sonar.projectKey=todo-list-app-v2
sonar.projectName=Todo List App v2
sonar.projectVersion=2.0.0

sonar.sources=backend/src,frontend/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.db,**/coverage/**,**/*.test.ts,**/*.spec.ts

sonar.host.url=http://localhost:9000
# Token passed at runtime via -Dsonar.token="$SONAR_TOKEN" (never hardcoded in the repo)
sonar.sourceEncoding=UTF-8
sonar.eslint.exclusions=**/node_modules/**
# SonarJS supports a single tsconfigPath; the frontend one covers the app code.
sonar.typescript.tsconfigPath=frontend/tsconfig.json
